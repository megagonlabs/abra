[project]
name = "abra-adapters"
version = "0.0.0"
description = "ABRA Python adapters — generated Pydantic mirror + shared apply_delta replica-merge"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
# datamodel-code-generator is PINNED: its (and its bundled black's) formatting
# decides the committed spec.py byte-for-byte, so CI's gen-is-clean check needs
# the same version that produced it. Bump deliberately + re-run `pnpm gen`.
dev = [
  "datamodel-code-generator==0.64.0",
  "websockets>=12",
]
# The custom-anthropic agent harness (adapters/run.py -> adapters/agents/custom.py). Needs
# ANTHROPIC_API_KEY at runtime.
# Install: uv pip install -e ".[dev,agent]". Framework adapters (langgraph/openai/
# claude SDKs) have their own extras below.
agent = ["anthropic>=0.40"]
# The custom harness over an OpenAI-format provider (--provider openai|fireworks|groq|together).
# Needs the matching key (OPENAI_API_KEY / FIREWORKS_API_KEY / …). Install: ".[dev,custom-openai]".
custom-openai = ["openai>=1.40"]
# Framework adapters (opt-in; each also needs its own runtime, e.g. an API key or CLI):
claude-sdk = ["claude-agent-sdk>=0.1"]   # also needs the Claude Code CLI on $PATH
# langgraph hard-pinned (the stable StateGraph API we build on); chat model floats within 1.x.
langgraph = ["langgraph==1.2.5", "langchain-anthropic>=1.4,<2"]   # ANTHROPIC_API_KEY at runtime
openai = ["openai-agents>=0.17,<1"]   # the OpenAI Agents SDK; OPENAI_API_KEY at runtime

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adapters"]
